[pytest]
# Pytest 설정 파일

# 테스트 파일 패턴
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 테스트 경로
testpaths = tests

# 비동기 테스트 설정
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 출력 옵션
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 마커 정의
markers =
    asyncio: mark test as async
    unit: mark test as unit test
    integration: mark test as integration test
