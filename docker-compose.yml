version: '3.8'

services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bootrun_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-your_redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bootrun_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Redis만 Docker 컨테이너 사용
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
