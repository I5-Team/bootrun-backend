version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override for Docker deployment - app uses Redis service name
      - REDIS_HOST=bootrun_redis
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: bootrun_redis
    ports:
      - "6379:6379"
    restart: always